name: build-knulli

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  arm64-package:
    runs-on: ubuntu-24.04-arm
    container: golang:1.24-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 build libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsdl2-dev zip file
      - name: Build application
        run: |
          mkdir -p build
          go test ./internal/...
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/muos-save-importer ./cmd/importer
          file build/muos-save-importer
          cp -L /usr/lib/aarch64-linux-gnu/libSDL2-2.0.so.0 build/
      - name: Assemble Knulli package
        run: |
          root="dist/muos-save-importer-knulli"
          mkdir -p "$root/system/muos-save-importer/lib" "$root/roms/ports"
          install -m 0755 build/muos-save-importer "$root/system/muos-save-importer/muos-save-importer"
          install -m 0644 build/libSDL2-2.0.so.0 "$root/system/muos-save-importer/lib/libSDL2-2.0.so.0"
          install -m 0644 assets/systems.json "$root/system/muos-save-importer/systems.json"
          install -m 0755 "packaging/Importar Saves muOS.sh" "$root/roms/ports/Importar Saves muOS.sh"
          install -m 0644 README.md "$root/LEIA-ME.md"
          cd dist && zip -r muos-save-importer-knulli-arm64.zip muos-save-importer-knulli
      - uses: actions/upload-artifact@v4
        with:
          name: muos-save-importer-knulli-arm64
          path: dist/muos-save-importer-knulli-arm64.zip
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/muos-save-importer-knulli-arm64.zip
          body: Automated Knulli ARM64 build.
          overwrite_files: true
